worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # JSON logging format for structured logging
    log_format json '{"time_local":"$time_local",'
                    '"remote_addr":"$remote_addr",'
                    '"remote_user":"$remote_user",'
                    '"request":"$request",'
                    '"status":"$status",'
                    '"body_bytes_sent":"$body_bytes_sent",'
                    '"request_time":"$request_time",'
                    '"http_referer":"$http_referer",'
                    '"http_user_agent":"$http_user_agent"}';

    access_log  /var/log/nginx/access.log json;
    error_log   /var/log/nginx/error.log  info;

    server {
        listen 8080;
        server_name localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;
        
        # Include standard MIME types first
        include /etc/nginx/mime.types;
        
        # Default type for unknown files
        default_type application/octet-stream;

        port_in_redirect off;

        # Gzip compression for better performance
        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        # Vite assets directory - serve directly, never fallback to index.html
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # ES modules (.mjs) need explicit MIME type
        location ~* \.mjs$ {
            try_files $uri =404;
            types { application/javascript mjs; }
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # HTML files - no cache to ensure fresh index.html on deploys
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # SPA routing - serve index.html for any route without file extension
        location / {
            # index.html should not be cached to avoid stale asset references
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint for AWS ALB/ECS
        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"healthy","timestamp":"$time_iso8601","service":"frontend"}\n';
        }

        # Security headers
        add_header Content-Security-Policy "upgrade-insecure-requests";
        add_header Content-Security-Policy "default-src 'unsafe-inline' 'unsafe-eval' * 'self' data: blob:";
        add_header Content-Security-Policy-Report-Only "default-src 'unsafe-inline' 'unsafe-eval' * 'self' data: blob:; report-uri /r/violation";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
